<body>
<div id="app"></div>
<template id="tpl-main">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'Lexend', system-ui, sans-serif; color: #14213A; background: #F4F6F9">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 100%; background: #FFFFFF; color: #3C4654; border-right: 1px solid #E1E6ED; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 8px">
<img src="apd-logo.png" alt="APD Construction" style="width: 156px; height: auto">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #566170">Bid &amp; Project Hub</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>Dashboard</a>
<a class="nav" href="bid-finder.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Bid Finder</a>
<a class="nav" href="proposals.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>Proposals</a>
<a class="nav" href="follow-ups.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg><span style="flex: 1">Follow-ups</span><span style="background: #16478D; color: #FFFFFF; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 2px 8px">9</span></a>
<a class="nav" href="bid-intel.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Bid Intel</a>
<a class="nav" href="projects.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>Projects</a>
<a class="nav on" href="settings.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>Data &amp; email</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-top: 1px solid #E1E6ED">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #16478D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">AP</div>
<div style="display: flex; flex-direction: column"><span style="color: #14213A; font-size: 14px; font-weight: 600">Ariel Padilla</span><span style="font-size: 12px; color: #566170">President</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 112px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #566170">The system of record — nothing gets lost</span>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Data, backups &amp; email sync</h1>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" class="btn" style="background: #FFFFFF; color: #14213A; border: 1px solid #CFD6DF">Download full export</button>
<button type="button" class="btn" style="background: #14213A; color: #FFFFFF; border: 0">Restore a record</button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<section style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Company email sync</h2>
<span style="font-size: 12px; font-weight: 700; color: #2F6B3A; background: #E4F1E6; padding: 4px 10px; border-radius: 12px">✓ Connected · synced 2 min ago</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<div style="border: 2px solid #14213A; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 15px">Microsoft 365 / Outlook</strong><span style="font-size: 13px; color: #566170">Company sign-in · 6 mailboxes</span></div>
<div style="border: 1px solid #E1E6ED; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 15px">Google Workspace</strong><span style="font-size: 13px; color: #566170">Supported · not in use</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Sent and received emails</strong> with a customer contact are attached to that customer’s timeline automatically — no copy/paste.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Replies stop the follow-up sequence</strong> and alert the rep, so a client never gets an automated nudge after answering.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Engagement:</strong> email opens, tracked proposal-link views, time on pricing, and forwards to new people.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Calendar meetings</strong> with customers are logged; follow-ups go out from each rep’s own address.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Privacy:</strong> only messages with known customer contacts are synced; personal and internal email is ignored.</span></div>
</div>
<div>
<div class="st" style="font-size: 12px; font-weight: 700; color: #566170; text-transform: uppercase; letter-spacing: 0.6px; border-top: 0"><span>Mailbox</span><span>Role</span><span>Status</span></div>
<div class="st"><span>[estimator1]@[company].com</span><span>Estimator</span><span style="color: #2F6B3A; font-weight: 600">✓ Syncing</span></div>
<div class="st"><span>[estimator2]@[company].com</span><span>Estimator</span><span style="color: #2F6B3A; font-weight: 600">✓ Syncing</span></div>
<div class="st"><span>[sales]@[company].com</span><span>Residential sales</span><span style="color: #2F6B3A; font-weight: 600">✓ Syncing</span></div>
<div class="st"><span>[bids]@[company].com</span><span>Shared bid inbox</span><span style="color: #8A5A00; font-weight: 600">! Re-authorize</span></div>
</div>
</section>

<section style="flex: 1 1 440px; min-width: 0; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Backups &amp; data protection</h2>
<span style="font-size: 12px; font-weight: 700; color: #2F6B3A; background: #E4F1E6; padding: 4px 10px; border-radius: 12px">✓ All protections on</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Continuous backup</strong> — restore the database to any minute in the last 35 days.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Nightly snapshot copied off-site</strong> to a second data-center region, kept 12 months.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Weekly export to APD’s own SharePoint / OneDrive</strong> (Excel + CSV), so the company always holds a copy it controls.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Nothing is hard-deleted:</strong> deleted records go to a 30-day trash, and every change is in an audit log (who, what, when).</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Access control:</strong> company Microsoft sign-in with two-factor, roles for owner / estimator / PM / office.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Restore tested monthly</strong> — a backup only counts if it has been restored successfully.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Documents never lost:</strong> uploads resume after a dropped connection, and a file is marked saved only when the cloud confirms two copies.</span></div>
<div class="item"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg><span><strong>Every version kept:</strong> replacing a file keeps the old one; nothing is overwritten.</span></div>
</div>
<div>
<div class="st" style="font-size: 12px; font-weight: 700; color: #566170; text-transform: uppercase; letter-spacing: 0.6px; border-top: 0"><span>Check</span><span>Last run</span><span>Result</span></div>
<div class="st"><span>Continuous backup</span><span>Running</span><span style="color: #2F6B3A; font-weight: 600">✓ Healthy</span></div>
<div class="st"><span>Off-site snapshot</span><span>Today, 3:00 AM</span><span style="color: #2F6B3A; font-weight: 600">✓ Complete</span></div>
<div class="st"><span>SharePoint export</span><span>Sun Oct 11, 2:00 AM</span><span style="color: #2F6B3A; font-weight: 600">✓ Complete</span></div>
<div class="st"><span>Restore test</span><span>Thu Oct 1</span><span style="color: #2F6B3A; font-weight: 600">✓ Passed</span></div>
</div>
</section>
</div>

<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Licenses &amp; certifications</h2>
<span style="font-size: 13px; color: #566170">Reminders 90 / 60 / 30 days before expiry · attached to government bids automatically</span>
</div>
<div style="overflow-x: auto"><div style="min-width: 620px">
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px; font-size: 12px; font-weight: 700; color: #566170; text-transform: uppercase; letter-spacing: 0.6px; border-top: 0"><span>Credential</span><span>Renewal date</span><span>Status</span></div>
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px"><span><strong>General Contractor</strong> · CGC062726</span><span>[Renewal date]</span><span style="color: #2F6B3A; font-weight: 600">✓ Active</span></div>
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px"><span><strong>Plumbing Contractor</strong> · CFC1430332</span><span>[Renewal date]</span><span style="color: #2F6B3A; font-weight: 600">✓ Active</span></div>
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px"><span><strong>Roofing Contractor</strong> · CCC1332764</span><span>[Renewal date]</span><span style="color: #2F6B3A; font-weight: 600">✓ Active</span></div>
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px"><span><strong>Orange County</strong> M/WBE certification</span><span>[Renewal date]</span><span style="color: #2F6B3A; font-weight: 600">✓ Active</span></div>
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px"><span><strong>City of Orlando</strong> M/WBE certification</span><span>[Renewal date]</span><span style="color: #2F6B3A; font-weight: 600">✓ Active</span></div>
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px"><span><strong>GOAA</strong> small / minority business certification</span><span>[Renewal date]</span><span style="color: #8A5A00; font-weight: 600">! Renew in 60 days</span></div>
<div class="st" style="grid-template-columns: 1.6fr 1fr 140px"><span><strong>Insurance certificates &amp; bonding capacity</strong></span><span>[Renewal date]</span><span style="color: #2F6B3A; font-weight: 600">✓ On file</span></div>
</div></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Moving off the spreadsheets</h2>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px">
<li style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #2F6B3A">✓ STEP 1</span><strong style="font-size: 14px">Upload current spreadsheets</strong><span style="font-size: 13px; color: #566170">Bid log, customer list, project tracker</span></li>
<li style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #2F6B3A">✓ STEP 2</span><strong style="font-size: 14px">Match columns</strong><span style="font-size: 13px; color: #566170">Customer, contact, phone, email, type, date, value</span></li>
<li style="background: #FCE9DF; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #9A3412">STEP 3 · IN PROGRESS</span><strong style="font-size: 14px">Clean duplicates</strong><span style="font-size: 13px; color: #566170">Same customer entered different ways</span></li>
<li style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 700; color: #566170">STEP 4</span><strong style="font-size: 14px">Start follow-ups on open bids</strong><span style="font-size: 13px; color: #566170">Old proposals get a “still interested?” email</span></li>
</ol>
</section>

</main>
<dc-import name="NewProposal" start-open="no" hint-size="0px,0px"></dc-import>
</div>
</template>
<template id="tpl-np">
<div style="font-family: 'Lexend', system-ui, sans-serif; color: #14213A">

<sc-if value="{{showTab}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{openIt}}" style="position: fixed; right: 24px; bottom: 24px; z-index: 50; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 22px; border: 0; border-radius: 28px; background: #16478D; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(27, 30, 34, 0.28)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New proposal / customer</button>
</sc-if>

<sc-if value="{{showPanel}}" hint-placeholder-val="{{false}}">
<section role="dialog" aria-label="New proposal or customer" style="position: fixed; right: 24px; bottom: 24px; z-index: 50; width: 480px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow-y: auto; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 14px; box-shadow: 0 16px 48px rgba(27, 30, 34, 0.3); display: flex; flex-direction: column; box-sizing: border-box">

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 19px; font-weight: 700">New proposal</h2><span style="font-size: 13px; color: #566170">Creates the customer, contact and proposal in one step</span></div>
<button type="button" onClick="{{closeIt}}" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: #F4F6F9; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #14213A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>

<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div style="padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="background: #E4F1E6; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 16px; color: #2F6B3A">✓ Proposal logged · P-26-122</strong>
<span style="font-size: 14px; line-height: 1.5">Customer and contact saved. Follow-ups (<strong>{{seqName}}</strong>) go out automatically from the assigned rep’s email, and permit watch starts at the project address.</span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{another}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #CFD6DF; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Log another</button>
<a href="proposal.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #14213A; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Open proposal</a>
</div>
</div>
</sc-if>

<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<div role="tablist" aria-label="Sections" style="display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid #EBEFF4">
<button type="button" role="tab" aria-selected="{{detailsSel}}" onClick="{{showDetails}}" style="{{detailsTabStyle}}">Customer &amp; proposal</button>
<button type="button" role="tab" aria-selected="{{logSel}}" onClick="{{showLog}}" style="{{logTabStyle}}">Communications ({{logCount}})</button>
</div>

<sc-if value="{{isDetails}}" hint-placeholder-val="{{true}}">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #566170">Customer</h3>

<div style="display: flex; flex-direction: column; gap: 12px">

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Project address *<input type="text" placeholder="Street, city — used for permit watch" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Lead source<select style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>PlanHub</option><option>BuildingConnected</option><option>Public portal</option><option>Contractor relationship</option><option>Referral</option><option>Direct / website</option></select></label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Trade<select style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>Roofing — commercial</option><option>Roofing — residential</option><option>Commercial plumbing</option><option>New construction</option><option>Renovation</option><option>Public works</option><option>Pre-engineered metal building</option><option>Painting</option><option>Custom home</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Bid value *<input type="text" inputmode="decimal" placeholder="$0" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Date submitted *<input type="date" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Assigned rep *<select style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>[Estimator 1]</option><option>[Estimator 2]</option><option>[Sales rep]</option></select></label>
</div>
<sc-if value="{{isGov}}" hint-placeholder-val="{{true}}">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Solicitation / bid no.<input type="text" placeholder="e.g. ITB-26-0412" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">M/WBE certification used<select style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>Orange County M/WBE</option><option>City of Orlando M/WBE</option><option>GOAA</option><option>None required</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Award date (expected)<input type="date" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
</div>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Proposal file (PDF)<input type="file" accept="application/pdf" style="font: inherit; font-weight: 400; font-size: 13px; min-height: 44px; padding: 10px 12px; border: 1px dashed #AEB7C2; border-radius: 8px; box-sizing: border-box; width: 100%; background: #F7F9FC"></label>
<div style="background: #E3EAF3; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #14213A">Follow-up sequence: <strong>{{seqName}}</strong> — starts automatically when saved.</div>
</div>
</div>
</sc-if>

<sc-if value="{{isLog}}" hint-placeholder-val="{{false}}">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Email opens</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Proposal views</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Replies</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
</div>
<span style="font-size: 13px; color: #566170; line-height: 1.5">Emails to and from this contact are logged automatically from the company mailbox. Add calls, meetings and site visits by hand.</span>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{log}}" as="e" hint-placeholder-count="1">
<li style="border: 1px solid #EBEFF4; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span style="font-size: 12px; font-weight: 700; color: #14305F; background: #E3EAF3; padding: 3px 8px; border-radius: 10px">{{e.kind}}</span><span style="font-size: 12px; color: #566170">{{e.date}}</span><span style="font-size: 12px; color: #2F6B3A; font-weight: 600">{{e.tag}}</span></div>
<span style="font-size: 14px; line-height: 1.4">{{e.text}}</span>
</li>
</sc-for>
</ol>
<div style="border-top: 1px solid #EBEFF4; padding-top: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700">Add communication</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Type<select value="{{kind}}" onChange="{{onKind}}" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>Call</option><option>Meeting</option><option>Site visit</option><option>Text</option><option>Email</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Notes<textarea value="{{note}}" onChange="{{onNote}}" rows="3" placeholder="What was discussed, next step, decision date…" style="font: inherit; font-weight: 400; font-size: 14px; padding: 10px 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF; resize: vertical"></textarea></label>
<button type="button" onClick="{{addLog}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #14213A; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Add to log</button>
</div>
</div>
</sc-if>

<div style="position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; background: #FFFFFF; border-top: 1px solid #EBEFF4">
<button type="button" onClick="{{closeIt}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #CFD6DF; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Cancel</button>
<button type="button" onClick="{{save}}" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #16478D; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Save proposal</button>
</div>
</sc-if>
</section>
</sc-if>

</div>
</template>
<script>
DC.define('main', (function () { 
class Component extends DCLogic {
renderVals() {
return {};
}
}
 return Component; })(), 'tpl-main');
DC.define('NewProposal', (function () { 
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const open = st.open !== undefined ? st.open : this.props.startOpen !== 'no';
const tab = st.tab || 'details';
const type = st.type || 'Government';
const saved = !!st.saved;
const log = st.log || [{ date: 'Oct 16 · 9:12 AM', kind: 'Email', text: 'Proposal sent to the point of contact from the rep’s company mailbox.', tag: 'Auto-synced' }];
const kind = st.kind || 'Call';
const note = st.note || '';
const seqs = { Government: '48 hrs · 7 days · 30 days (no-contact rules on)', Commercial: '48 hrs · 7 days · 30 days', Residential: '48 hrs · 7 days · 30 days' };
const tabStyle = (on) => 'min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: -1px; border-bottom: 3px solid ' + (on ? '#16478D' : 'transparent') + '; color: ' + (on ? '#14213A' : '#566170');
const types = ['Residential', 'Commercial', 'Government'].map((label) => {
const on = label === type;
return {
label,
pressed: on ? 'true' : 'false',
style: 'min-height: 44px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#14213A' : '#CFD6DF') + '; background: ' + (on ? '#14213A' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#14213A'),
pick: () => this.setState({ type: label })
};
});
return {
showTab: !open,
showPanel: open,
saved,
editing: !saved,
isDetails: tab === 'details',
isLog: tab === 'log',
detailsSel: tab === 'details' ? 'true' : 'false',
logSel: tab === 'log' ? 'true' : 'false',
detailsTabStyle: tabStyle(tab === 'details'),
logTabStyle: tabStyle(tab === 'log'),
logCount: log.length,
types,
isGov: type === 'Government',
seqName: seqs[type],
log,
kind,
note,
openIt: () => this.setState({ open: true }),
closeIt: () => this.setState({ open: false, saved: false, tab: 'details' }),
showDetails: () => this.setState({ tab: 'details' }),
showLog: () => this.setState({ tab: 'log' }),
onKind: (e) => this.setState({ kind: e.target.value }),
onNote: (e) => this.setState({ note: e.target.value }),
addLog: () => {
if (!note.trim()) return;
this.setState({ log: log.concat([{ date: 'Today', kind, text: note.trim(), tag: 'Logged by rep' }]), note: '' });
},
save: () => this.setState({ saved: true }),
another: () => this.setState({ saved: false, tab: 'details', log: undefined, note: '' })
};
}
}
 return Component; })(), 'tpl-np');
DC.mount(document.getElementById('app'), 'main', {});
</script>
</body>
</html>
