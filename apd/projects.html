<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projects · APD Bid &amp; Project Hub</title>
<link rel="icon" type="image/png" href="apd-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F9}
a{color:#14305F}a:hover{color:#16478D}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#3C4654;text-decoration:none;font-size:14px;font-weight:500;min-height:44px;box-sizing:border-box}
.nav:hover{background:#EEF3FA;color:#16478D}
.nav.on{background:#E3ECF8;color:#16478D;font-weight:600}
.nav.on svg{color:#16478D}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;box-sizing:border-box;cursor:pointer;font-family:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.cl{display:grid;grid-template-columns:1.6fr 110px 110px 110px 1.6fr;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid #EBEFF4;font-size:14px}
</style>

<script src="morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl-main">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'Lexend', system-ui, sans-serif; color: #14213A; background: #F4F6F9">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 100%; background: #FFFFFF; color: #3C4654; border-right: 1px solid #E1E6ED; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 8px">
<img src="apd-logo.png" alt="APD Construction" style="width: 156px; height: auto">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #566170">Bid &amp; Project Hub</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>Dashboard</a>
<a class="nav" href="bid-finder.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Bid Finder</a>
<a class="nav" href="proposals.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>Proposals</a>
<a class="nav" href="follow-ups.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg><span style="flex: 1">Follow-ups</span><span style="background: #16478D; color: #FFFFFF; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 2px 8px">9</span></a>
<a class="nav" href="bid-intel.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Bid Intel</a>
<a class="nav on" href="projects.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>Projects</a>
<a class="nav" href="settings.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>Data &amp; email</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-top: 1px solid #E1E6ED">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #16478D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">AP</div>
<div style="display: flex; flex-direction: column"><span style="color: #14213A; font-size: 14px; font-weight: 600">Ariel Padilla</span><span style="font-size: 12px; color: #566170">President</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 112px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap"><span style="font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: #566170">From won bid to closeout</span><span style="font-size: 12px; font-weight: 600; color: #8A5A00; background: #FBF0D9; padding: 3px 8px; border-radius: 6px">Sample data</span></div>
<h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px">Projects, milestones &amp; profitability</h1>
</div>
<button type="button" class="btn" style="background: #FFFFFF; color: #14213A; border: 1px solid #CFD6DF">Export job-cost report</button>
</header>

<section aria-label="Select project" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
<span style="font-weight: 700; font-size: 15px">{{c.name}}</span>
<span style="font-size: 13px; opacity: 0.85">{{c.phase}} · {{c.pct}}% complete</span>
<span style="{{c.badgeStyle}}">{{c.badge}}</span>
</button>
</sc-for>
</section>

<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">{{p.name}}</h2>
<span style="font-size: 13px; color: #566170">Client: {{p.client}} · PM [Name]</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px">
<div style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #566170">Contract value</span><span class="mono" style="font-size: 22px; font-weight: 600">{{p.contract}}</span></div>
<div style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #566170">Cost to date</span><span class="mono" style="font-size: 22px; font-weight: 600">{{p.toDate}}</span></div>
<div style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #566170">Bid margin</span><span class="mono" style="font-size: 22px; font-weight: 600">{{p.bidMargin}}</span></div>
<div style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #566170">Forecast margin</span><span class="mono" style="{{p.fcStyle}}">{{p.fcMargin}}</span></div>
<div style="background: #F7F9FC; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600; color: #566170">Change orders</span><span class="mono" style="font-size: 22px; font-weight: 600">{{p.co}}</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; font-size: 15px; font-weight: 700">Milestones</h3>
<ol style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px">
<sc-for list="{{miles}}" as="m" hint-placeholder-count="8">
<li style="{{m.boxStyle}}">
<span style="{{m.dotStyle}}">{{m.mark}}</span>
<span style="font-size: 13px; font-weight: 600; line-height: 1.3">{{m.label}}</span>
<span style="font-size: 12px; color: #566170">{{m.date}}</span>
</li>
</sc-for>
</ol>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; box-sizing: border-box">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 18px 16px 12px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Budget vs. actual by cost code</h2>
<span style="font-size: 13px; color: #566170">$ thousands · budget comes straight from the winning estimate</span>
</div>
<div style="overflow-x: auto">
<div style="min-width: 760px">
<div class="cl" style="font-size: 12px; font-weight: 700; color: #566170; text-transform: uppercase; letter-spacing: 0.6px; background: #F7F9FC"><span>Cost code</span><span>Budget</span><span>Actual to date</span><span>Forecast</span><span>Status</span></div>
<sc-for list="{{lines}}" as="l" hint-placeholder-count="5">
<div class="cl">
<strong>{{l.name}}</strong>
<span class="mono">{{l.budget}}</span>
<span class="mono">{{l.actual}}</span>
<span class="mono">{{l.forecast}}</span>
<span style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap"><span style="{{l.chipStyle}}">{{l.chip}}</span><span style="font-size: 13px; color: #566170">{{l.note}}</span></span>
</div>
</sc-for>
</div>
</div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center"><div style="display: flex; flex-direction: column; gap: 4px"><h2 style="margin: 0; font-size: 18px; font-weight: 700">Project documents</h2><span style="font-size: 13px; color: #2F6B3A; font-weight: 600">✓ All 172 files saved · 2 cloud copies · last upload 9:42 AM</span></div><label style="position: relative; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; background: #16478D; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; overflow: hidden">+ Upload files<input type="file" multiple aria-label="Upload files" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<div style="border: 1px solid #EBEFF4; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">Contract &amp; change orders</span><span style="font-size: 12px; color: #566170">6 files</span></div>
<div style="border: 1px solid #EBEFF4; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">Permits &amp; inspections</span><span style="font-size: 12px; color: #566170">4 files</span></div>
<div style="border: 1px solid #EBEFF4; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">Insurance / COIs</span><span style="font-size: 12px; color: #566170">3 files</span></div>
<div style="border: 1px solid #EBEFF4; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">Submittals</span><span style="font-size: 12px; color: #566170">11 files</span></div>
<div style="border: 1px solid #EBEFF4; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">Daily photos</span><span style="font-size: 12px; color: #566170">148 files</span></div>
<div style="border: 1px solid #EBEFF4; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; font-weight: 600">Closeout &amp; warranty</span><span style="font-size: 12px; color: #566170">0 files</span></div>
</div>
<span style="font-size: 13px; color: #566170">Upload from the office or the job site. If the signal drops, the upload waits on the phone and finishes on its own.</span>
</section>

</main>
<dc-import name="NewProposal" start-open="no" hint-size="0px,0px"></dc-import>
</div>
</template>
<template id="tpl-np">
<div style="font-family: 'Lexend', system-ui, sans-serif; color: #14213A">

<sc-if value="{{showTab}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{openIt}}" style="position: fixed; right: 24px; bottom: 24px; z-index: 50; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 22px; border: 0; border-radius: 28px; background: #16478D; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(27, 30, 34, 0.28)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New proposal / customer</button>
</sc-if>

<sc-if value="{{showPanel}}" hint-placeholder-val="{{false}}">
<section role="dialog" aria-label="New proposal or customer" style="position: fixed; right: 24px; bottom: 24px; z-index: 50; width: 480px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow-y: auto; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 14px; box-shadow: 0 16px 48px rgba(27, 30, 34, 0.3); display: flex; flex-direction: column; box-sizing: border-box">

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 19px; font-weight: 700">New proposal</h2><span style="font-size: 13px; color: #566170">Creates the customer, contact and proposal in one step</span></div>
<button type="button" onClick="{{closeIt}}" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: #F4F6F9; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #14213A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>

<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div style="padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="background: #E4F1E6; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 16px; color: #2F6B3A">✓ Proposal logged · P-26-122</strong>
<span style="font-size: 14px; line-height: 1.5">Customer and contact saved. Follow-ups (<strong>{{seqName}}</strong>) go out automatically from the assigned rep’s email, and permit watch starts at the project address.</span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<button type="button" onClick="{{another}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #CFD6DF; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Log another</button>
<a href="proposal.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 8px; background: #14213A; color: #FFFFFF; font-size: 14px; font-weight: 600; text-decoration: none">Open proposal</a>
</div>
</div>
</sc-if>

<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<div role="tablist" aria-label="Sections" style="display: flex; gap: 4px; padding: 0 20px; border-bottom: 1px solid #EBEFF4">
<button type="button" role="tab" aria-selected="{{detailsSel}}" onClick="{{showDetails}}" style="{{detailsTabStyle}}">Customer &amp; proposal</button>
<button type="button" role="tab" aria-selected="{{logSel}}" onClick="{{showLog}}" style="{{logTabStyle}}">Communications ({{logCount}})</button>
</div>

<sc-if value="{{isDetails}}" hint-placeholder-val="{{true}}">
<div style="padding: 18px 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #566170">Customer</h3>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Customer / company *<input type="text" placeholder="Search existing or add new" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Point of contact *<input type="text" placeholder="Full name" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Title / role<input type="text" placeholder="e.g. Facilities Director" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Phone *<input type="tel" placeholder="(407) 555-0100" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Email *<input type="email" placeholder="name@company.com" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: #566170">Proposal</h3>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 600">Proposal type *</span>
<div role="group" aria-label="Proposal type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{types}}" as="t" hint-placeholder-count="3">
<button type="button" onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">{{t.label}}</button>
</sc-for>
</div>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Project name *<input type="text" placeholder="e.g. Fleet maintenance bldg re-roof" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Project address *<input type="text" placeholder="Street, city — used for permit watch" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"></label>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Municipality<select style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>City of Orlando</option><option>Orange County</option><option>Osceola County / Kissimmee</option><option>Seminole County</option><option>Winter Park</option><option>Other</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Lead source<select style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>PlanHub</option><option>BuildingConnected</option><option>Public portal</option><option>Contractor relationship</option><option>Referral</option><option>Direct / website</option></select></label>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px">
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Trade<select style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>Roofing — commercial</option><option>Roofing — residential</option><option>Commercial plumbing</option><option>New construction</option><option>Renovation</option><option>Public works</option><option>Pre-engineered metal building</option><option>Painting</option><option>Custom home</option></select></label>

<sc-if value="{{isLog}}" hint-placeholder-val="{{false}}">

<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Email opens</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Proposal views</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Replies</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
</div>
<span style="font-size: 13px; color: #566170; line-height: 1.5">Emails to and from this contact are logged automatically from the company mailbox. Add calls, meetings and site visits by hand.</span>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">

</li>

<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Type<select value="{{kind}}" onChange="{{onKind}}" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>Call</option><option>Meeting</option><option>Site visit</option><option>Text</option><option>Email</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Notes<textarea value="{{note}}" onChange="{{onNote}}" rows="3" placeholder="What was discussed, next step, decision date…" style="font: inherit; font-weight: 400; font-size: 14px; padding: 10px 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF; resize: vertical"></textarea></label>
<button type="button" onClick="{{addLog}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #14213A; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Add to log</button>
</div>
</div>
</sc-if>

<div style="position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; background: #FFFFFF; border-top: 1px solid #EBEFF4">
<button type="button" onClick="{{closeIt}}" style="min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #CFD6DF; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Cancel</button>
<button type="button" onClick="{{save}}" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #16478D; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Save proposal</button>
</div>
</sc-if>
</section>
</sc-if>

</div>
</template>
<script>
DC.define('main', (function () { 
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 0;
const chip = (fg, bg) => 'font-size: 12px; font-weight: 700; color: ' + fg + '; background: ' + bg + '; padding: 4px 10px; border-radius: 12px; white-space: nowrap';
const good = chip('#2F6B3A', '#E4F1E6');
const warn = chip('#8A5A00', '#FBF0D9');
const projects = [
{ name: 'Orange County — Fleet bldg re-roof', client: 'Orange County Facilities Mgmt', phase: 'Tear-off & dry-in', pct: 45, contract: '$1.24M', toDate: '$452K', bidMargin: '18.0%', fcMargin: '18.0%', risk: false, badge: '✓ On track', co: '+$38K',
current: 4, miles: [['Contract signed', 'Aug 18'], ['Permits', 'Sep 2'], ['Materials ordered', 'Sep 5'], ['Mobilization', 'Sep 22'], ['Tear-off & dry-in', 'Due Oct 30'], ['Roof system', 'Nov 20'], ['Inspection', 'Dec 2'], ['Closeout & warranty', 'Dec 15']],
lines: [['Labor', 380, 171, 385, ''], ['Materials', 470, 222, 468, ''], ['Subcontractors', 90, 31, 88, ''], ['Equipment & dumpsters', 45, 22, 48, 'Extra dumpster swap'], ['General conditions', 32, 6, 30, '']] },
{ name: 'Lakeview Medical — Plumbing retrofit', client: 'Lakeview Medical Plaza', phase: 'Rough-in', pct: 70, contract: '$520K', toDate: '$322K', bidMargin: '22.0%', fcMargin: '14.0%', risk: true, badge: '! Margin at risk', co: '$0 · 1 pending',
current: 3, miles: [['Contract signed', 'Jul 7'], ['Permits', 'Jul 21'], ['Demo', 'Aug 4'], ['Rough-in', 'Late · was Oct 2'], ['Rough-in inspection', 'Oct 27'], ['Fixtures & trim', 'Nov 10'], ['Final inspection', 'Nov 24'], ['Closeout', 'Dec 1']],
lines: [['Labor', 180, 171, 224, 'Overtime — rough-in ran 2 weeks long'], ['Materials', 160, 108, 158, ''], ['Subcontractors', 40, 30, 42, ''], ['Equipment', 14, 9, 14, ''], ['General conditions', 12, 4, 9, '']] },
{ name: 'GOAA — Admin bldg renovation', client: 'GOAA (Orlando Int’l Airport)', phase: 'Closeout', pct: 95, contract: '$860K', toDate: '$710K', bidMargin: '15.0%', fcMargin: '17.0%', risk: false, badge: '✓ Ahead of bid', co: '+$22K',
current: 7, miles: [['Contract signed', 'Mar 3'], ['Permits', 'Mar 24'], ['Mobilization', 'Apr 7'], ['Demo', 'Apr 28'], ['Build-out', 'Jul 30'], ['MEP inspections', 'Aug 25'], ['Substantial completion', 'Sep 30'], ['Closeout & punch list', 'Due Oct 23']],
lines: [['Labor', 260, 250, 252, ''], ['Materials', 300, 284, 286, ''], ['Subcontractors', 120, 118, 118, ''], ['Equipment', 25, 24, 24, ''], ['General conditions', 26, 34, 34, 'Extended site trailer']] }
];
const p = projects[sel];
const cards = projects.map((x, i) => {
const on = i === sel;
return {
name: x.name, phase: x.phase, pct: x.pct, badge: x.badge,
badgeStyle: x.risk ? warn : good,
pressed: on ? 'true' : 'false',
style: 'display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; min-height: 96px; padding: 16px; border-radius: 12px; cursor: pointer; font: inherit; box-sizing: border-box; border: 2px solid ' + (on ? '#16478D' : '#E1E6ED') + '; background: #FFFFFF; color: #14213A',
pick: () => this.setState({ sel: i })
};
});
const miles = p.miles.map((m, i) => {
const done = i < p.current;
const cur = i === p.current;
const late = cur && p.risk;
return {
label: m[0], date: m[1],
mark: done ? '✓' : String(i + 1),
boxStyle: 'display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; border: 1px solid ' + (cur ? (late ? '#8A5A00' : '#16478D') : '#EBEFF4') + '; background: ' + (cur ? (late ? '#FBF0D9' : '#FCE9DF') : (done ? '#F7F9FC' : '#FFFFFF')),
dotStyle: 'width: 26px; height: 26px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; box-sizing: border-box; ' + (done ? 'background: #14305F; color: #FFFFFF' : cur ? 'background: ' + (late ? '#8A5A00' : '#16478D') + '; color: #FFFFFF' : 'background: #FFFFFF; color: #566170; border: 2px solid #AEB7C2')
};
});
const lines = p.lines.map((l) => {
const over = l[3] > l[1] * 1.03;
return {
name: l[0], budget: '$' + l[1], actual: '$' + l[2], forecast: '$' + l[3], note: l[4],
chip: over ? '! Over +$' + (l[3] - l[1]) : '✓ Within budget',
chipStyle: over ? warn : good
};
});
return {
cards, miles, lines,
p: Object.assign({}, p, { fcStyle: 'font-size: 22px; font-weight: 600; color: ' + (p.risk ? '#8A5A00' : '#2F6B3A') })
};
}
}
 return Component; })(), 'tpl-main');
DC.define('NewProposal', (function () { 
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const open = st.open !== undefined ? st.open : this.props.startOpen !== 'no';
const tab = st.tab || 'details';
const type = st.type || 'Government';
const saved = !!st.saved;
const log = st.log || [{ date: 'Oct 16 · 9:12 AM', kind: 'Email', text: 'Proposal sent to the point of contact from the rep’s company mailbox.', tag: 'Auto-synced' }];
const kind = st.kind || 'Call';
const note = st.note || '';
const seqs = { Government: '48 hrs · 7 days · 30 days (no-contact rules on)', Commercial: '48 hrs · 7 days · 30 days', Residential: '48 hrs · 7 days · 30 days' };
const tabStyle = (on) => 'min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: -1px; border-bottom: 3px solid ' + (on ? '#16478D' : 'transparent') + '; color: ' + (on ? '#14213A' : '#566170');
const types = ['Residential', 'Commercial', 'Government'].map((label) => {
const on = label === type;
return {
label,
pressed: on ? 'true' : 'false',
style: 'min-height: 44px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#14213A' : '#CFD6DF') + '; background: ' + (on ? '#14213A' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#14213A'),
pick: () => this.setState({ type: label })
};
});
return {
showTab: !open,
showPanel: open,
saved,
editing: !saved,
isDetails: tab === 'details',
isLog: tab === 'log',
detailsSel: tab === 'details' ? 'true' : 'false',
logSel: tab === 'log' ? 'true' : 'false',
detailsTabStyle: tabStyle(tab === 'details'),
logTabStyle: tabStyle(tab === 'log'),
logCount: log.length,
types,
isGov: type === 'Government',
seqName: seqs[type],
log,
kind,
note,
openIt: () => this.setState({ open: true }),
closeIt: () => this.setState({ open: false, saved: false, tab: 'details' }),
showDetails: () => this.setState({ tab: 'details' }),
showLog: () => this.setState({ tab: 'log' }),
onKind: (e) => this.setState({ kind: e.target.value }),
onNote: (e) => this.setState({ note: e.target.value }),
addLog: () => {
if (!note.trim()) return;
this.setState({ log: log.concat([{ date: 'Today', kind, text: note.trim(), tag: 'Logged by rep' }]), note: '' });
},
save: () => this.setState({ saved: true }),
another: () => this.setState({ saved: false, tab: 'details', log: undefined, note: '' })
};
}
}
 return Component; })(), 'tpl-np');
DC.mount(document.getElementById('app'), 'main', {});
</script>
</body>
