<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Proposal P-26-114 · APD Bid &amp; Project Hub</title>
<link rel="icon" type="image/png" href="apd-logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F6F9}
a{color:#14305F}a:hover{color:#16478D}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;color:#3C4654;text-decoration:none;font-size:14px;font-weight:500;min-height:44px;box-sizing:border-box}
.nav:hover{background:#EEF3FA;color:#16478D}
.nav.on{background:#E3ECF8;color:#16478D;font-weight:600}
.nav.on svg{color:#16478D}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;box-sizing:border-box;cursor:pointer;font-family:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#14213A}
.fld input,.fld select{font:inherit;font-weight:400;font-size:14px;min-height:44px;padding:0 12px;border:1px solid #CFD6DF;border-radius:8px;background:#FFFFFF;box-sizing:border-box;color:#14213A}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.4}
.chk input{width:18px;height:18px;margin-top:1px;accent-color:#16478D}
</style>

<script src="morphdom-umd.min.js"></script>
<script src="dc-lite.js"></script>
</head>
<body>
<div id="app"></div>
<template id="tpl-main">
<div style="display: flex; flex-wrap: wrap; min-height: 100vh; font-family: 'Lexend', system-ui, sans-serif; color: #14213A; background: #F4F6F9">

<nav aria-label="Main" style="flex: 1 1 220px; max-width: 100%; background: #FFFFFF; color: #3C4654; border-right: 1px solid #E1E6ED; padding: 24px 16px; display: flex; flex-direction: column; gap: 28px; box-sizing: border-box">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 0 8px">
<img src="apd-logo.png" alt="APD Construction" style="width: 156px; height: auto">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: #566170">Bid &amp; Project Hub</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<a class="nav" href="index.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>Dashboard</a>
<a class="nav" href="bid-finder.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Bid Finder</a>
<a class="nav on" href="proposals.html" aria-current="page"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><path d="M14 3v6h6"></path></svg>Proposals</a>
<a class="nav" href="follow-ups.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg><span style="flex: 1">Follow-ups</span><span style="background: #16478D; color: #FFFFFF; font-size: 12px; font-weight: 700; border-radius: 10px; padding: 2px 8px">9</span></a>
<a class="nav" href="bid-intel.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Bid Intel</a>
<a class="nav" href="projects.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>Projects</a>
<a class="nav" href="settings.html"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"></ellipse><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg>Data &amp; email</a>
</div>
<div style="margin-top: auto; display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-top: 1px solid #E1E6ED">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #16478D; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">AP</div>
<div style="display: flex; flex-direction: column"><span style="color: #14213A; font-size: 14px; font-weight: 600">Ariel Padilla</span><span style="font-size: 12px; color: #566170">President</span></div>
</div>
</nav>

<main style="flex: 999 1 560px; min-width: 0; padding: 32px 32px 112px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">

<header style="display: flex; flex-direction: column; gap: 14px">
<a href="proposals.html" style="font-size: 14px; font-weight: 600; text-decoration: none">← Proposal log</a>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center">
<span class="mono" style="font-size: 13px; color: #566170">P-26-114</span>
<span style="font-size: 12px; font-weight: 700; color: #14305F; background: #E3EAF3; padding: 4px 10px; border-radius: 12px">Government</span>
<span style="{{statusStyle}}">{{statusLabel}}</span>
<span style="font-size: 12px; font-weight: 700; color: #9A3412; background: #FCE9DF; padding: 4px 10px; border-radius: 12px">Hot · opened 4×</span>
</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px">Orange County Facilities Mgmt — Fleet maintenance bldg re-roof</h1>
<span style="font-size: 14px; color: #566170">Bid value <strong class="mono" style="color: #14213A">$1,820,000</strong> · Sent Oct 9 · Estimator [Name]</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button type="button" class="btn" style="background: #FFFFFF; color: #14213A; border: 1px solid #CFD6DF">Log a call</button>
<button type="button" class="btn" style="background: #FFFFFF; color: #14213A; border: 1px solid #CFD6DF">Pause sequence</button>
<button type="button" class="btn" onClick="{{markWon}}" style="background: #2F6B3A; color: #FFFFFF; border: 0">✓ Mark won</button>
<button type="button" class="btn" onClick="{{markLost}}" style="background: #A61B1B; color: #FFFFFF; border: 0">✕ Mark lost</button>
</div>
</div>
</header>

<sc-if value="{{isLost}}" hint-placeholder-val="{{false}}">
<section aria-label="Record lost bid" style="background: #FFFFFF; border: 2px solid #A61B1B; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Loss review: why, to whom, and where to be next time</h2>
<span style="font-size: 14px; color: #566170">Pre-filled from the public bid tabulation posted Oct 14. Confirm and save.</span>
</div>
<button type="button" class="btn" onClick="{{reset}}" style="background: #FFFFFF; color: #14213A; border: 1px solid #CFD6DF">Cancel</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<label class="fld">Winning contractor<input type="text" value="[Competitor A] Roofing, Inc."></label>
<label class="fld">Winning amount<input type="text" value="$1,694,000"></label>
<label class="fld">How we found out<select><option>Public bid tabulation</option><option>Client told us</option><option>Permit record</option><option>Other</option></select></label>
<label class="fld">Main reason<select><option>Price</option><option>Schedule</option><option>Relationship</option><option>Scope / qualifications</option><option>Unknown</option></select></label>
</div>
<div style="display: flex; gap: 24px; flex-wrap: wrap; font-size: 14px; background: #F7F9FC; border-radius: 8px; padding: 12px 16px">
<span>APD bid <strong class="mono">$1,820,000</strong></span>
<span>Difference <strong class="mono" style="color: #A61B1B">+$126,000 (+7.4%)</strong></span>
<span>Times [Competitor A] beat APD this year <strong class="mono">3</strong></span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<label class="fld">Where APD needs to be next time<input type="text" placeholder="e.g. Roofing within 3% of [Competitor A] on GOAA work"></label>
<label class="fld">Lesson for the next bid<input type="text" placeholder="e.g. Re-check labor hours and material markup"></label>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<label class="chk"><input type="checkbox" checked>Send the winner an automatic intro offering APD’s plumbing, roofing and general trades</label>
<label class="chk"><input type="checkbox" checked>Send the client a “thank you — keep us in mind” email and add them to the 30-day check-in list</label>
<label class="chk"><input type="checkbox">Request a bid debrief from the procurement officer</label>
</div>
<div><a class="btn" href="bid-intel.html" style="background: #14213A; color: #FFFFFF">Save &amp; open Bid Intel</a></div>
</section>
</sc-if>

<sc-if value="{{isWon}}" hint-placeholder-val="{{false}}">
<section aria-label="Convert to project" style="background: #FFFFFF; border: 2px solid #2F6B3A; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">Won — convert to a project</h2>
<span style="font-size: 14px; color: #566170">The follow-up sequence stops automatically. The estimate becomes the project budget.</span>
</div>
<button type="button" class="btn" onClick="{{reset}}" style="background: #FFFFFF; color: #14213A; border: 1px solid #CFD6DF">Cancel</button>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
<label class="fld">Contract value<input type="text" value="$1,820,000"></label>
<label class="fld">Estimated cost (from bid)<input type="text" value="$1,492,400"></label>
<label class="fld">Target start<input type="text" value="Nov 16, 2026"></label>
<label class="fld">Milestone template<select><option>Government re-roof</option><option>Commercial build-out</option><option>Residential re-roof</option><option>Custom home</option></select></label>
</div>
<div><a class="btn" href="projects.html" style="background: #2F6B3A; color: #FFFFFF">Create project</a></div>
</section>
</sc-if>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<div style="flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 24px">

<section aria-label="Client engagement" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #566170; font-weight: 600">Email opens</span><span class="mono" style="font-size: 24px; font-weight: 600">4</span></div>
<div style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #566170; font-weight: 600">Proposal views</span><span class="mono" style="font-size: 24px; font-weight: 600">3</span></div>
<div style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #566170; font-weight: 600">Time on pricing</span><span class="mono" style="font-size: 24px; font-weight: 600">6m 20s</span></div>
<div style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; color: #566170; font-weight: 600">Forwarded to</span><span class="mono" style="font-size: 24px; font-weight: 600">2 new</span></div>
</section>

<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px">
<div style="display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Follow-up timeline</h2>
<a href="follow-ups.html" style="font-size: 14px; font-weight: 600">Sequence: Proposal follow-up →</a>
</div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="7">
<li style="display: flex; gap: 16px">
<div style="display: flex; flex-direction: column; align-items: center; width: 20px">
<span style="{{s.dot}}"></span>
<span style="flex: 1; width: 2px; background: #E1E6ED; min-height: 16px"></span>
</div>
<div style="flex: 1; min-width: 0; padding-bottom: 18px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline">
<span class="mono" style="font-size: 12px; color: #566170; width: 90px">{{s.when}}</span>
<strong style="font-size: 15px">{{s.title}}</strong>
<span style="{{s.tagStyle}}">{{s.tag}}</span>
</div>
<span style="font-size: 13px; color: #566170; padding-left: 100px">{{s.detail}}</span>
</div>
</li>
</sc-for>
</ol>
</section>
</div>

<aside style="flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Bid details</h2>
<dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14px">
<dt style="color: #566170">Project site</dt><dd style="margin: 0">[Address], Orlando · permit watch on</dd>
<dt style="color: #566170">Solicitation</dt><dd style="margin: 0" class="mono">[ITB-26-0412]</dd>
<dt style="color: #566170">Bid due</dt><dd style="margin: 0">Oct 9, 2:00 PM</dd>
<dt style="color: #566170">Award expected</dt><dd style="margin: 0">Oct 30 BCC meeting</dd>
<dt style="color: #566170">Bond</dt><dd style="margin: 0">5% bid bond · submitted</dd>
<dt style="color: #566170">M/WBE</dt><dd style="margin: 0">Orange County certification applied</dd>
<dt style="color: #566170">Trades</dt><dd style="margin: 0">Roofing, sheet metal</dd>
<dt style="color: #566170">Est. margin</dt><dd style="margin: 0" class="mono">18.0%</dd>
</dl>
</section>
<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Contacts</h2>
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px">[Name] · Facilities Director</strong><span style="font-size: 13px; color: #566170">Primary · opened 3×</span></div>
<div style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px">[Name] · Procurement Officer</strong><span style="font-size: 13px; color: #566170">CC on all follow-ups</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; background: #FCE9DF; border-radius: 8px; padding: 12px"><strong style="font-size: 13px; color: #9A3412">New contact detected</strong><span style="font-size: 13px; color: #14213A">Proposal was forwarded to a Maintenance Supervisor. Add them to the follow-up?</span><button type="button" class="btn" style="background: #FFFFFF; color: #14213A; border: 1px solid #CFD6DF; min-height: 40px; font-size: 13px; align-self: flex-start">Add contact</button></div>
</section>
<section style="background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 12px; padding: 20px 24px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Documents (5)</h2>
<label style="position: relative; display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; background: #16478D; color: #FFFFFF; font-size: 13px; font-weight: 600; cursor: pointer; overflow: hidden">+ Upload files<input type="file" multiple aria-label="Upload files" style="position: absolute; inset: 0; opacity: 0; cursor: pointer"></label>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid #EBEFF4"><span style="font-size: 14px; font-weight: 600; word-break: break-word">Proposal_Fleet-bldg_rev2.pdf</span><span style="font-size: 12px; color: #566170">2.4 MB · version 2 · Oct 9</span><span style="font-size: 12px; color: #2F6B3A; font-weight: 600">✓ Saved · 2 cloud copies</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid #EBEFF4"><span style="font-size: 14px; font-weight: 600; word-break: break-word">Bid-form_signed.pdf</span><span style="font-size: 12px; color: #566170">310 KB · Oct 9</span><span style="font-size: 12px; color: #2F6B3A; font-weight: 600">✓ Saved · 2 cloud copies</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid #EBEFF4"><span style="font-size: 14px; font-weight: 600; word-break: break-word">Takeoff_roof-areas.xlsx</span><span style="font-size: 12px; color: #566170">88 KB · Oct 8</span><span style="font-size: 12px; color: #2F6B3A; font-weight: 600">✓ Saved · 2 cloud copies</span></div>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 10px 0; border-top: 1px solid #EBEFF4"><span style="font-size: 14px; font-weight: 600; word-break: break-word">Addendum-02.pdf</span><span style="font-size: 12px; color: #566170">1.1 MB · from the bids inbox · Oct 6</span><span style="font-size: 12px; color: #2F6B3A; font-weight: 600">✓ Saved automatically from email</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 0; border-top: 1px solid #EBEFF4"><span style="font-size: 14px; font-weight: 600">Site-walk photos (18 files)</span><div style="height: 6px; background: #EAEFF5; border-radius: 3px"><div style="height: 6px; width: 64%; background: #16478D; border-radius: 3px"></div></div><span style="font-size: 12px; color: #566170">Uploading 64% · resumes on its own if the connection drops</span></div>
<span style="font-size: 12px; color: #566170; line-height: 1.5">A file is only marked Saved after the cloud confirms both copies.</span>
</section>
</aside>
</div>

</main>
<dc-import name="NewProposal" start-open="no" hint-size="0px,0px"></dc-import>
</div>
</template>
<template id="tpl-np">
<div style="font-family: 'Lexend', system-ui, sans-serif; color: #14213A">

<sc-if value="{{showTab}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{openIt}}" style="position: fixed; right: 24px; bottom: 24px; z-index: 50; display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 22px; border: 0; border-radius: 28px; background: #16478D; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 24px rgba(27, 30, 34, 0.28)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>New proposal / customer</button>
</sc-if>

<sc-if value="{{showPanel}}" hint-placeholder-val="{{false}}">
<section role="dialog" aria-label="New proposal or customer" style="position: fixed; right: 24px; bottom: 24px; z-index: 50; width: 480px; max-width: calc(100vw - 32px); max-height: calc(100vh - 48px); overflow-y: auto; background: #FFFFFF; border: 1px solid #E1E6ED; border-radius: 14px; box-shadow: 0 16px 48px rgba(27, 30, 34, 0.3); display: flex; flex-direction: column; box-sizing: border-box">

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 18px 20px 12px">
<div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 19px; font-weight: 700">New proposal</h2><span style="font-size: 13px; color: #566170">Creates the customer, contact and proposal in one step</span></div>
<button type="button" onClick="{{closeIt}}" aria-label="Close" style="width: 44px; height: 44px; border: 0; border-radius: 8px; background: #F4F6F9; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #14213A"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</div>

<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div style="padding: 8px 20px 24px; display: flex; flex-direction: column; gap: 14px">
<div style="background: #E4F1E6; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 16px; color: #2F6B3A">✓ Proposal logged · P-26-122</strong>
<span style="font-size: 14px; line-height: 1.5">Customer and contact saved. Follow-ups (<strong>{{seqName}}</strong>) go out automatically from the assigned rep’s email, and permit watch starts at the project address.</span>
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">

<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Proposal views</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
<div style="background: #F7F9FC; border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #566170; font-weight: 600">Replies</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600">0</span></div>
</div>
<span style="font-size: 13px; color: #566170; line-height: 1.5">Emails to and from this contact are logged automatically from the company mailbox. Add calls, meetings and site visits by hand.</span>

<span style="font-size: 14px; line-height: 1.4">{{e.text}}</span>
</li>
</sc-for>
</ol>
<div style="border-top: 1px solid #EBEFF4; padding-top: 14px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 700">Add communication</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Type<select value="{{kind}}" onChange="{{onKind}}" style="font: inherit; font-weight: 400; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF"><option>Call</option><option>Meeting</option><option>Site visit</option><option>Text</option><option>Email</option></select></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Notes<textarea value="{{note}}" onChange="{{onNote}}" rows="3" placeholder="What was discussed, next step, decision date…" style="font: inherit; font-weight: 400; font-size: 14px; padding: 10px 12px; border: 1px solid #CFD6DF; border-radius: 8px; box-sizing: border-box; width: 100%; color: #14213A; background: #FFFFFF; resize: vertical"></textarea></label>
<button type="button" onClick="{{addLog}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #14213A; background: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Add to log</button>
</div>

<div style="position: sticky; bottom: 0; display: flex; justify-content: flex-end; gap: 10px; padding: 14px 20px; background: #FFFFFF; border-top: 1px solid #EBEFF4">

<button type="button" onClick="{{save}}" style="min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #16478D; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer">Save proposal</button>

<script>
DC.define('main', (function () { 
class Component extends DCLogic {
renderVals() {
const outcome = (this.state && this.state.outcome) || null;
const dot = (bg, ring) => 'width: 14px; height: 14px; border-radius: 7px; box-sizing: border-box; margin-top: 2px; background: ' + bg + '; border: 2px solid ' + ring;
const tag = (fg, bg) => 'font-size: 11px; font-weight: 700; color: ' + fg + '; background: ' + bg + '; padding: 3px 8px; border-radius: 10px';
const done = dot('#14305F', '#14305F');
const today = dot('#16478D', '#16478D');
const later = dot('#FFFFFF', '#AEB7C2');
const steps = [
{ when: 'Oct 9', title: 'Proposal sent', detail: 'Tracked proposal link sent from the rep’s company email.', tag: 'Done', tagStyle: tag('#14305F', '#E3EAF3'), dot: done },
{ when: 'Oct 11', title: '48 hours · Thank you for the opportunity', detail: 'Sent automatically. Opened 2× — client viewed the roof plan and pricing.', tag: 'Opened', tagStyle: tag('#9A3412', '#FCE9DF'), dot: done },
{ when: 'Oct 14', title: 'Engagement alert', detail: 'Opened 3+ times — rep notified. Nothing required; follow-ups continue on their own.', tag: 'Done', tagStyle: tag('#14305F', '#E3EAF3'), dot: done },
{ when: 'Today 9:00', title: '7 days · Any questions?', detail: 'Automatic email with warranty summary and similar county projects.', tag: 'Scheduled', tagStyle: tag('#FFFFFF', '#16478D'), dot: today },
{ when: 'Oct 30', title: 'Bid results check', detail: 'Agent reads the award posting after the commission meeting.', tag: 'Automatic', tagStyle: tag('#566170', '#EDF0F4'), dot: later },
{ when: 'Nov 8', title: '30 days · Status check', detail: 'Automatic: “Has a decision been made?” — asks who was selected if it went elsewhere.', tag: 'Automatic', tagStyle: tag('#566170', '#EDF0F4'), dot: later },
{ when: 'Daily', title: 'Permit watch', detail: 'Agent searches the permit portal at the project address until a permit is pulled.', tag: 'Automatic', tagStyle: tag('#566170', '#EDF0F4'), dot: later }
];
const chip = (fg, bg) => 'font-size: 12px; font-weight: 700; color: ' + fg + '; background: ' + bg + '; padding: 4px 10px; border-radius: 12px';
const statusLabel = outcome === 'won' ? '✓ Won' : outcome === 'lost' ? '✕ Lost' : 'Following up';
const statusStyle = outcome === 'won' ? chip('#2F6B3A', '#E4F1E6') : outcome === 'lost' ? chip('#A61B1B', '#FBE4E4') : chip('#14305F', '#E3EAF3');
return {
steps,
statusLabel,
statusStyle,
isLost: outcome === 'lost',
isWon: outcome === 'won',
markWon: () => this.setState({ outcome: 'won' }),
markLost: () => this.setState({ outcome: 'lost' }),
reset: () => this.setState({ outcome: null })
};
}
}
 return Component; })(), 'tpl-main');
DC.define('NewProposal', (function () { 
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const open = st.open !== undefined ? st.open : this.props.startOpen !== 'no';
const tab = st.tab || 'details';
const type = st.type || 'Government';
const saved = !!st.saved;
const log = st.log || [{ date: 'Oct 16 · 9:12 AM', kind: 'Email', text: 'Proposal sent to the point of contact from the rep’s company mailbox.', tag: 'Auto-synced' }];
const kind = st.kind || 'Call';
const note = st.note || '';
const seqs = { Government: '48 hrs · 7 days · 30 days (no-contact rules on)', Commercial: '48 hrs · 7 days · 30 days', Residential: '48 hrs · 7 days · 30 days' };
const tabStyle = (on) => 'min-height: 44px; padding: 0 12px; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: -1px; border-bottom: 3px solid ' + (on ? '#16478D' : 'transparent') + '; color: ' + (on ? '#14213A' : '#566170');
const types = ['Residential', 'Commercial', 'Government'].map((label) => {
const on = label === type;
return {
label,
pressed: on ? 'true' : 'false',
style: 'min-height: 44px; border-radius: 8px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid ' + (on ? '#14213A' : '#CFD6DF') + '; background: ' + (on ? '#14213A' : '#FFFFFF') + '; color: ' + (on ? '#FFFFFF' : '#14213A'),
pick: () => this.setState({ type: label })
};
});
return {
showTab: !open,
showPanel: open,
saved,
editing: !saved,
isDetails: tab === 'details',
isLog: tab === 'log',
detailsSel: tab === 'details' ? 'true' : 'false',
logSel: tab === 'log' ? 'true' : 'false',
detailsTabStyle: tabStyle(tab === 'details'),
logTabStyle: tabStyle(tab === 'log'),
logCount: log.length,
types,
isGov: type === 'Government',
seqName: seqs[type],
log,
kind,
note,
openIt: () => this.setState({ open: true }),
closeIt: () => this.setState({ open: false, saved: false, tab: 'details' }),
showDetails: () => this.setState({ tab: 'details' }),
showLog: () => this.setState({ tab: 'log' }),
onKind: (e) => this.setState({ kind: e.target.value }),
onNote: (e) => this.setState({ note: e.target.value }),
addLog: () => {
if (!note.trim()) return;
this.setState({ log: log.concat([{ date: 'Today', kind, text: note.trim(), tag: 'Logged by rep' }]), note: '' });
},
save: () => this.setState({ saved: true }),
another: () => this.setState({ saved: false, tab: 'details', log: undefined, note: '' })
};
}
}
 return Component; })(), 'tpl-np');
DC.mount(document.getElementById('app'), 'main', {});
</script>
